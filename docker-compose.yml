version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bookmymeet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-bookmymeet}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmymeet-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Secrets carry no defaults: compose fails fast rather than silently booting the
    # stack on a credential that is published in this file. Supply them in a root .env.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a root .env file}@postgres:5432/${POSTGRES_DB:-bookmymeet}
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in a root .env file}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in a root .env file}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD in a root .env file}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmymeet-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    ports:
      - "80:80"

volumes:
  postgres_data:
